version: 2
updates:
  # Backend dependencies
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "[backend] "
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "vitest"
          - "ts-node*"
          - "nodemon"
          - "cross-env"
          - "pino-pretty"
          - "supertest"
        dependency-type: "development"
      prod-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "vitest"
          - "ts-node*"
          - "nodemon"
          - "cross-env"
          - "pino-pretty"
          - "supertest"
        dependency-type: "production"
    # Auto-merge for patch and minor updates that pass tests
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Ignore major version updates for critical packages
      - dependency-name: "express"
        update-type: "version-update:semver-major"
      - dependency-name: "typescript"
        update-type: "version-update:semver-major"
      - dependency-name: "vitest"
        update-type: "version-update:semver-major"

  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "[frontend] "
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "vitest"
          - "@testing-library/*"
          - "jsdom"
          - "oxlint"
          - "typescript"
          - "vite"
          - "@vitejs/plugin-react"
          - "autoprefixer"
          - "postcss"
          - "tailwindcss"
          - "sharp"
        dependency-type: "development"
      prod-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "vitest"
          - "@testing-library/*"
          - "jsdom"
          - "oxlint"
          - "typescript"
          - "vite"
          - "@vitejs/plugin-react"
          - "autoprefixer"
          - "postcss"
          - "tailwindcss"
          - "sharp"
        dependency-type: "production"
    ignore:
      - dependency-name: "react"
        update-type: "version-update:semver-major"
      - dependency-name: "vite"
        update-type: "version-update:semver-major"
      - dependency-name: "tailwindcss"
        update-type: "version-update:semver-major"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "[docker] "