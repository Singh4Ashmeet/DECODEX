server {
    listen 80;
    server_name localhost;

    # Serve static React build
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # SSE (Server-Sent Events) — dedicated block with no buffering and long timeout.
    # Must come before the generic /api/ block so nginx matches it first.
    location ~* ^/api/.*?/status/stream$ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        # SSE requires Connection: keep-alive and no buffering
        proxy_set_header Connection 'keep-alive';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Disable all buffering so events are flushed immediately to the client
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Long timeout to keep the SSE stream alive during transcription + classification.
        # OpenAI Whisper + GPT-4o can take up to 60s; 180s gives ample headroom.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Generic API proxy — standard request/response, supports WebSocket upgrades
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # Standard timeout — generous for slow OpenAI calls but not unlimited
        proxy_read_timeout 120s;
    }
}
